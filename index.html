<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamArchive | Past Papers for Students</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
<script src="app.js"></script>
<!-- NAVBAR -->
<header>
  <nav>
    <div class="logo" onclick="showPage('home')">
      <div class="logo-icon">📚</div>Exam<span>Archive</span>
    </div>
    <ul class="nav-links">
        <li><a href="home.html" onclick="showPage('home')">Home</a></li>
      <li><a href="subjects.html" onclick="showPage('home')">Subjects</a></li>
      <li><a href="papers.html"   onclick="showPage('home')">Papers</a></li>
      <li><a href="markscheme.html"    onclick="showPage('home')">Mark Schemes</a></li>
      <li><a href="upload.html"   onclick="showPage('home')">Upload</a></li>
      <li><a href="about.html"   onclick="showPage('home')">About</a></li>
    </ul>
    <div class="nav-actions">
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
        <span class="t-icon moon">🌙</span>
        <span class="t-icon sun">☀️</span>
      </button>
      <button class="btn-outline" onclick="openModal('login')">Log In</button>
      <button class="btn-primary" onclick="openModal('signup')">Sign Up Free</button>
    </div>
    <button class="hamburger" onclick="toggleMobileNav()">☰</button>
  </nav>
</header>

<div class="mobile-nav" id="mobileNav">
    <a href="home.html" onclick="showPage('home');toggleMobileNav()">Home</a>
  <a href="subjects.html" onclick="showPage('home');toggleMobileNav()">Subjects</a>
  <a href="papers.html"   onclick="showPage('home');toggleMobileNav()">Papers</a>
  <a href="markscheme.html"    onclick="showPage('home');toggleMobileNav()">Mark Schemes</a>
  <a href="upload.html"   onclick="showPage('home');toggleMobileNav()">Upload</a>
   <a href="about.html"   onclick="showPage('home');toggleMobileNav()">About</a>
</div>

<!-- ═══ SUBJECT PAGE ═══ -->
<div id="page-subject" class="page">
  <div class="subj-page" id="subjPageContent"></div>
  <footer>
    <div class="footer-inner">
      <div class="footer-logo">Exam<span>Archive</span></div>
      <p class="footer-copy">© 2026 ExamArchive. Built to help every student succeed.</p>
    </div>
  </footer>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3 id="modalTitle">Welcome Back</h3>
    <p id="modalDesc">Sign in to access your saved papers and downloads.</p>
    <div class="modal-tabs">
      <button class="modal-tab active" id="tabLogin" onclick="switchTab('login')">Log In</button>
      <button class="modal-tab" id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
    </div>
    <div class="form-group" style="margin-bottom:14px"><label>EMAIL ADDRESS</label><input type="email" placeholder="you@example.com"></div>
    <div class="form-group" style="margin-bottom:20px"><label>PASSWORD</label><input type="password" placeholder="••••••••"></div>
    <button class="submit-btn" onclick="closeModal()" style="margin-top:0">Continue</button>
  </div>
</div>
</body>
</html>
